name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Check Java style
        run: mvn -B checkstyle:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require exactly one phase label on pull requests
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          mode = 'informational'
          if os.environ['EVENT_NAME'] == 'pull_request':
              with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
                  event = json.load(event_file)
              labels = {label['name'] for label in event['pull_request']['labels']}
              phases = labels & {'phase:tests', 'phase:fix'}
              if len(phases) != 1:
                  print('::error::Apply exactly one of phase:tests or phase:fix to this PR.')
                  sys.exit(1)
              mode = phases.pop()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'mode={mode}', file=output)
          print(f'Test mode: {mode}')
          PY

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Only assertion/test failures are tolerated; compilation and build errors fail.
      - name: Run the entire test suite
        id: suite
        env:
          TEST_MODE: ${{ steps.phase.outputs.mode }}
        run: |
          if [ "$TEST_MODE" = 'phase:fix' ]; then
            mvn -B test
          else
            mvn -B -Dmaven.test.failure.ignore=true test
          fi

      # A strict Surefire failure stops Maven before the test-phase JaCoCo report.
      - name: Generate coverage after a failed suite
        if: ${{ always() && steps.suite.outcome == 'failure' }}
        continue-on-error: true
        run: mvn -B jacoco:report

      - name: Summarize JUnit results and JaCoCo coverage
        id: report
        if: ${{ always() && steps.suite.outcome != 'skipped' }}
        continue-on-error: true
        env:
          TEST_MODE: ${{ steps.phase.outputs.mode }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def cell(value):
              return html.escape(str(value)).replace('|', '&#124;').replace('\n', ' ')[:400]

          run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          lines = [
              '<!-- cs4472-ci-report -->',
              '## JUnit results and JaCoCo coverage (informational)',
              f"Mode: `{os.environ['TEST_MODE']}`. Maven step: **{os.environ['SUITE_OUTCOME']}**.",
              f'[Full workflow logs and downloadable reports]({run_url})',
              '',
              '### JUnit results',
          ]
          reports = sorted(Path('target/surefire-reports').glob('TEST-*.xml'))
          rows = []
          counts = {'Passed': 0, 'Failed': 0, 'Error': 0, 'Skipped': 0}
          for report in reports:
              for case in ET.parse(report).getroot().iter('testcase'):
                  status, detail = 'Passed', ''
                  for tag, label in [('failure', 'Failed'), ('error', 'Error'), ('skipped', 'Skipped')]:
                      result = case.find(tag)
                      if result is not None:
                          status = label
                          detail = result.get('message') or result.text or ''
                          break
                  counts[status] += 1
                  name = f"{case.get('classname', '')}.{case.get('name', '')}"
                  rows.append(f'| {cell(name)} | {status} | {cell(detail)} |')
          if rows:
              lines += [', '.join(f'{name}: {count}' for name, count in counts.items()), '',
                        '| Test case | Result | Detail |', '|---|---|---|']
              # Keep the PR comment below GitHub's size limit; artifacts retain all results.
              lines += rows[:60]
              if len(rows) > 60:
                  lines += [f'{len(rows) - 60} additional test cases are in the downloadable reports.']
          else:
              lines += ['No JUnit test results were produced. Check the Maven log; this is not a passing suite.']

          lines += ['', '### JaCoCo coverage']
          coverage = Path('target/site/jacoco/jacoco.xml')
          if coverage.exists():
              lines += ['| Metric | Covered | Missed | Coverage |', '|---|---:|---:|---:|']
              for counter in ET.parse(coverage).getroot().findall('counter'):
                  covered, missed = int(counter.get('covered')), int(counter.get('missed'))
                  total = covered + missed
                  percent = f'{100 * covered / total:.2f}%' if total else 'N/A'
                  lines += [f"| {counter.get('type')} | {covered} | {missed} | {percent} |"]
          else:
              lines += ['No JaCoCo report was produced. Check the Maven log.']
          lines += ['', 'The downloadable reports include JUnit XML/text and the JaCoCo HTML report.']
          body = '\n'.join(lines) + '\n'
          (Path(os.environ['RUNNER_TEMP']) / 'ci-report.md').write_text(body, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(body)
          PY

      - name: Save test results and coverage reports
        if: ${{ always() && steps.suite.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 90

      - name: Post informational test results and coverage on the PR
        if: ${{ always() && github.event_name == 'pull_request' && steps.report.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'ci-report.md'), 'utf8');
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body?.includes('<!-- cs4472-ci-report -->')
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
